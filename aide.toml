# AIDE project configuration — the single seam between the reusable framework
# (.aide/, .claude/) and this repository. Adopting AIDE in a new project means
# copying .aide/ + the .claude/ glue and editing THIS file; nothing else is
# project-specific. Parsed with the stdlib `tomllib` by .aide/scripts/aide.py.

[project]
name = "FACET"
source_dir = "src/segfacet"     # where production code lives (builder scope)
tests_dir = "tests"          # where tests live (test-writer scope)
docs_dir = "docs/aide"       # living documents; scripts derive queue/ items/ from it

[python]
venv = ".venv"                                   # venv directory name (per-machine, gitignored)
bootstrap = "pip install -e .[dev]"              # command to populate a fresh venv
# `-n auto` matches what every CI step already passes (`-n 4`): the suite is
# parallel-safe (no shared mutable state; every fixture writes under its own
# tmp_path) and pytest-xdist is a dev dependency. Without it the loop's own
# runs -- the validator's gate and `aide merge`'s re-test -- were the only
# serial ones left, at ~23 min against ~7 min. Measured 2026-09-04, item 149.
test_command = "python -m pytest -n auto"        # run relative to the resolved venv (aide.py prefixes .venv/Scripts or .venv/bin)
import_check = "segfacet"                            # module `aide env` imports to prove the venv is live

[git]
mode = "auto-merge"          # auto-merge | pr | local  — see .aide/conventions.md > Git modes
main_branch = "main"
branch_prefix = "aide/"      # claim branches are <branch_prefix>NNN-short-name

[loop]
queue_cap = 10               # ~max items a queue-planner batch may hold
validation_rounds = 3        # build<->validate cap before escalating/pausing
clarify = "assume"           # interactive | assume — see .aide/conventions.md > Clarify mode
claim_scope = "live-queue"   # live-queue | all-open — one queue at a time keeps the human checkpoint

[framework]
# Where `framework`-typed insights are handed over (gh issue target). The AIDE
# framework is developed standalone and materialised here by its installer.
repo = "dadrobny/aide-loop"

[validation]
# Named environment profiles for stage-validation items: `<name> = "<python expr>"`,
# true iff this environment provides the capability. Evaluated in the project venv by
# `python .aide/scripts/aide.py env --profile <name>` (exit 0 iff satisfied). A stage
# validation gated on an unsatisfied profile records ❓ Unverified, never a silent pass.
# These mirror the environment-gated capabilities described in CLAUDE.md.
#
# These are DEFINITIONS, not observations — the same on every machine and in CI, which
# is why they are committed. The per-machine *answer* is computed at runtime by
# `env --profile` and is deliberately never stored. Keep it that way: nothing here may
# encode a local path, mount, device index, or host name. Machine-varying inputs go in
# the environment instead (as the real VerSe19 cohort does, via SEGFACET_VERSE_COHORT).
pyradiomics = "__import__('radiomics') is not None"
docker = "__import__('subprocess').run(['docker', 'info'], capture_output=True).returncode == 0"
gpu = "__import__('cupy').cuda.runtime.getDeviceCount() > 0"
