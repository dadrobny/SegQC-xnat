# Default heuristic-config file (item 035).
#
# This file documents, in one place, the shipped code-default thresholds for
# every Stage 4 rule family (items 027-033) plus the verdict-aggregation
# policy (item 034). Loading it through segqc.config.load_config produces a
# HeuristicConfig that is behaviourally identical to the baked-in
# segqc.config.default_config() -- it MATERIALISES the existing hand-set
# defaults, it does not change them (see item 035 AC5). Each threshold below
# carries a one-line justification comment.
#
# Version policy: this file's schema_version must always equal
# segqc.config.SUPPORTED_SCHEMA_VERSION. Bump both together, in lock-step,
# only for an incompatible schema change, and update this comment.
schema_version: "0.1"

# Stage 1 empty-detection thresholds (item 007). Kept at their "no threshold
# applied" defaults so bundling this file changes no CLI behaviour beyond
# adding the features/findings report blocks (item 035 wiring).
min_foreground_voxels: 0
min_label_count: 0

rules:
  # ------------------------------------------------------------------ #
  # bounds (item 027) -- level-aware min/max physical volume + extent.
  # Values copied verbatim from heuristics/bounds.py::DEFAULT_BOUNDS --
  # conservative placeholder ranges superseded by Stage 6/7 calibration.
  # ------------------------------------------------------------------ #
  bounds:
    enabled: true
    params:
      # -------------------------------------------------------------- #
      # Bounds-source switch (item 048) -- documented here as COMMENTS
      # ONLY. Adding an active `source` (or `reference_*`) key would change
      # this file's parsed `rules` dict and hence `config_hash` (item 045
      # provenance) and could regress the Stage 5 golden snapshots, so the
      # code-side default is supplied instead via
      # HeuristicConfig.rule_param(..., default="hand-set"). Uncomment and
      # adjust to opt a deployment into reference-derived bounds once a
      # reference is attached to the record (item 049).
      #
      # source: hand-set | reference
      #   hand-set (default) -- today's behaviour: coarse per-group
      #   (cervical/thoracic/lumbar) bounds below, unchanged.
      #   reference -- per-level bounds derived from the
      #   ReferenceDistribution attached at record["reference"] (item 045),
      #   using the level's stored reference_lower_pct/reference_upper_pct
      #   percentiles. Any level the reference does not cover (or does not
      #   cover for reference_stratum), and any tracked metric a covered
      #   level lacks, falls back to the hand-set group bounds below --
      #   never crashes.
      #
      # reference_lower_pct: 1
      # reference_upper_pct: 99
      # reference_stratum: all
      severity: flagged-for-review
      cervical:
        min_volume_mm3: 3000.0
        max_volume_mm3: 35000.0
        min_extent_x_mm: 10.0
        max_extent_x_mm: 80.0
        min_extent_y_mm: 10.0
        max_extent_y_mm: 80.0
        min_extent_z_mm: 5.0
        max_extent_z_mm: 60.0
      thoracic:
        min_volume_mm3: 5000.0
        max_volume_mm3: 70000.0
        min_extent_x_mm: 15.0
        max_extent_x_mm: 100.0
        min_extent_y_mm: 15.0
        max_extent_y_mm: 100.0
        min_extent_z_mm: 8.0
        max_extent_z_mm: 80.0
      lumbar:
        min_volume_mm3: 8000.0
        # max_volume_mm3 pinned by item 035 AC3 -- must equal
        # heuristics/bounds.py::DEFAULT_BOUNDS["lumbar"]["max_volume_mm3"].
        max_volume_mm3: 120000.0
        min_extent_x_mm: 20.0
        max_extent_x_mm: 120.0
        min_extent_y_mm: 20.0
        max_extent_y_mm: 120.0
        min_extent_z_mm: 15.0
        max_extent_z_mm: 100.0

  # ------------------------------------------------------------------ #
  # fragmentation (item 028) -- connected-components fragmentation /
  # rogue-island detector.
  # ------------------------------------------------------------------ #
  fragmentation:
    enabled: true
    params:
      # Below this fraction, the largest component no longer dominates the
      # label -- judged split into comparable pieces (item 028 default).
      fragmentation_index_threshold: 0.75
      # A non-dominant component smaller than this voxel count is a rogue
      # island rather than meaningful anatomy (item 028 default).
      island_min_voxels: 50
      severity: flagged-for-review

  # ------------------------------------------------------------------ #
  # coverage (item 029) -- missing-level / incomplete-span detector.
  # Opt-in checks (expected_levels / expected_count) stay disabled: coverage
  # is structural, not a hand-set numeric threshold.
  # ------------------------------------------------------------------ #
  coverage:
    enabled: true
    params:
      border_aware: true
      expected_levels: []
      expected_count: null
      severity: flagged-for-review

  # ------------------------------------------------------------------ #
  # sequence (item 030) -- non-continuous anatomical label-order detector.
  # No numeric threshold: fires on relationships.out_of_order_labels.
  # ------------------------------------------------------------------ #
  sequence:
    enabled: true
    params:
      severity: flagged-for-review

  # ------------------------------------------------------------------ #
  # border (item 031) -- partial-vertebra-at-FOV-border detector.
  # Expected FOV-end truncations are suppressed by default
  # (report_expected_ends: false); only unexpected/in-plane clips flag.
  # ------------------------------------------------------------------ #
  border:
    enabled: true
    params:
      severity: flagged-for-review
      report_expected_ends: false
      end_severity: pass

  # ------------------------------------------------------------------ #
  # overlap (item 032) -- voxel-level label overlap detector.
  # ------------------------------------------------------------------ #
  overlap:
    enabled: true
    params:
      # A single shared voxel already indicates overlapping labels
      # (item 032 default) -- no tolerance for accidental voxel sharing.
      min_overlap_voxels: 1
      severity: flagged-for-review

  # ------------------------------------------------------------------ #
  # mislabel (item 033) -- spline-offset misalignment + ordering-
  # inconsistency detector.
  # ------------------------------------------------------------------ #
  mislabel:
    enabled: true
    params:
      # A centroid >= 15 mm off the fitted spinal curve is judged
      # misaligned (item 033 default).
      max_offset_mm: 15.0
      flag_offset_outliers: true
      flag_order_inconsistency: true
      severity: flagged-for-review

  # ------------------------------------------------------------------ #
  # intensity (item 062) -- implausible-intensity (absolute-band) rule.
  # Registered enabled-by-default with NO active section here (mirroring
  # reference_delta's own precedent, item 065's pivotal design decision):
  # adding an active `rules.intensity` section would change this file's
  # parsed `rules` dict and hence `config_hash` (item 045 provenance),
  # staling the committed reference_default.json and breaking item 035's
  # exact-seven-rule-id test. Values below are DOCUMENTATION ONLY, copied
  # verbatim from heuristics/intensity.py's code defaults -- uncomment and
  # adjust to opt a deployment into custom intensity thresholds.
  #
  # intensity:
  #   enabled: true
  #   params:
  #     flag_low: true
  #     flag_high: true
  #     flag_degenerate: true
  #     min_plausible_hu: 100.0
  #     max_plausible_hu: 2000.0
  #     max_degenerate_std: 1.0
  #     severity: flagged-for-review

  # ------------------------------------------------------------------ #
  # intensity_reference_delta (item 064) -- level-aware intensity
  # delta-to-reference rule. Same section-less-by-design rationale as
  # `intensity` above (and `reference_delta`) -- documentation only.
  # Values copied verbatim from heuristics/intensity_reference_delta.py's
  # code defaults.
  #
  # intensity_reference_delta:
  #   enabled: true
  #   params:
  #     flag_out_of_range: true
  #     flag_robust_z: true
  #     flag_distribution_distance: true
  #     max_robust_z: 3.5
  #     max_distribution_distance: 3.0
  #     severity: flagged-for-review

# Case-level verdict-aggregation policy (item 034).
verdict:
  # 0 = escalation disabled -- pure severity dominance, matching the
  # built-in aggregate_verdict default.
  flag_escalation_count: 0

# Reference-mode switch (item 049) -- documented here as COMMENTS ONLY. An
# active `reference:` section would change this file's parsed dict and hence
# `load_config(default_config_path()) == default_config()` (AC8) plus
# `config_hash`-adjacent expectations, so the code-side defaults are supplied
# instead via HeuristicConfig.reference_param(key, default). Uncomment and
# adjust to opt a deployment into reference mode without the `--reference`
# CLI flag.
#
# reference:
#   enabled: false          # off by default -- see item 049's Assumptions.
#   artifact_path: null     # null/absent -- loads bundled_default_reference().
#   lower_pct: 1
#   upper_pct: 99
#   stratum: all

# Intensity-mode switch (item 065) -- documented here as COMMENTS ONLY, for
# the same reason as `reference:` above: an active `intensity:` section
# would change this file's parsed dict and hence
# `load_config(default_config_path()) == default_config()` (AC12) plus
# `config_hash`-adjacent expectations, so the code-side defaults are supplied
# instead via HeuristicConfig.intensity_param(key, default). Uncomment and
# adjust to opt a deployment into intensity mode without the `--intensity`
# CLI flag.
#
# intensity:
#   enabled: false   # off by default -- see item 065's Assumptions.
#   radiomics: true  # PyRadiomics auto-degrades to first-order-only if absent.
