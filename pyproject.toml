[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "segfacet"
description = "FACET - Failure Analysis, Characterisation & Evaluation Toolkit for instance segmentations of spine imaging."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "David Drobny", email = "david.drobny@kcl.ac.uk" },
]
keywords = ["segmentation", "quality-control", "failure-analysis", "spine", "vertebra", "medical-imaging"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
# Core scientific stack. Lower-bound pins are chosen for the Python 3.11 floor
# (item 095); exact reproducibility pins belong in the deployable container's
# lockfile/constraints (Stage 9), not in library metadata. See item 001.
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.7",
    "scikit-image>=0.19",
    "nibabel>=4.0",
    "PyYAML>=5.4",
    "jsonschema>=3.2",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "matplotlib>=3.5",
]
# Optional Stage-8 extra (item 060): PyRadiomics (GLCM + shape features) behind
# an optional-import adapter (segfacet.features.radiomics). Kept out of core
# `dependencies` because it has historically had install friction across
# platforms/Python versions (it transitively pulls SimpleITK); the default
# feature set and test suite run fine without it. Install with
# `pip install segfacet[radiomics]`.
# Confirmed friction (2026-07-14, CI): pyradiomics's legacy setup.py does
# `import numpy` at build time without declaring numpy as a build-system
# requirement, so a plain `pip install segfacet[radiomics]` fails in pip's
# isolated build env with `ModuleNotFoundError: No module named 'numpy'`.
# Install core deps first, then pyradiomics with `--no-build-isolation`:
#   pip install -e .[dev]
#   pip install --no-build-isolation "pyradiomics>=3.0"
# See .github/workflows/ci.yml's verify-environment-gated job.
radiomics = [
    "pyradiomics>=3.0",
]
# Optional Stage-10 extra (item 071): CuPy, the CUDA-accelerated NumPy-alike
# consumed by segfacet.backend's GPU path (segfacet.backend.get_backend). Kept out
# of core `dependencies` -- the default backend is CPU/NumPy and the full
# test suite runs with zero required GPU dependencies; auto-detect silently
# falls back to CPU when cupy is absent. The requirement below is a loose
# lower bound only: CuPy ships CUDA-version-specific wheels
# (`cupy-cuda11x` / `cupy-cuda12x`) or a source build, so the user must pick
# the wheel matching their installed CUDA toolkit -- `pip install segfacet[gpu]`
# documents the dependency but does not, by itself, choose a working wheel.
gpu = [
    "cupy>=12",
]

[project.urls]
Homepage = "https://github.com/dadrobny/segfacet"
Repository = "https://github.com/dadrobny/segfacet"

[project.scripts]
segfacet = "segfacet.cli:main"

[tool.hatch.version]
path = "src/segfacet/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/segfacet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
