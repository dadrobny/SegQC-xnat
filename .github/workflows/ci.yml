name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Item 107 built this as a diff-based scope check, replacing the byte-hash
  # "scope fence" pytests it retired; item 117 retargeted it onto the
  # framework verb `aide scope`, which supersedes the project-local script
  # (both did the same framework-shaped work -- enforcing a framework
  # convention, on framework documents, in the framework's own loop -- but
  # only the verb keeps a fix landing upstream applying here too). Pure git
  # plus a stdlib Python -- no venv, no Docker, no network beyond the
  # checkout -- so it stays fast and dependency-free. Resolves the item
  # number for the PR branch from its own naming convention (aide/NNN-...)
  # and runs `aide.py scope` against the PR's base ref (github.base_ref) so a
  # changed file outside that item's declared `## Authorised paths` fails the
  # build.
  scope-check:
    name: item scope check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          # aide.py needs tomllib (stdlib since 3.11); the job otherwise
          # relies only on whatever `python` the runner image provides.
          python-version: "3.11"
      - name: Resolve item number for this branch
        id: item
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -e
          # Item branches are named aide/NNN-... (see .aide/conventions.md's
          # claim protocol); pull the leading item number out of the branch
          # name.
          #
          # Anchor on that exact shape rather than grepping for any 3-digit
          # run anywhere in the name. A queue branch is `aide/queue-NNN`,
          # where NNN is a *queue* number sharing a namespace with item
          # numbers: an unanchored match read `aide/queue-016` as item 016
          # and resolved the unrelated queue-002-era spec for item 016, which
          # predates the `## Authorised paths` convention -- so the checker
          # hard-errored on a missing section for an item the branch had
          # nothing to do with. A queue or specs
          # branch has no single owning item and correctly resolves to
          # nothing here; per-item scope is already enforced on each item
          # branch as it merges into the queue branch.
          item_number=$(echo "$HEAD_REF" | sed -n 's|^aide/\([0-9]\{3\}\)-.*|\1|p')
          if [ -z "$item_number" ]; then
            echo "could not extract a 3-digit item number from branch '$HEAD_REF'; skipping scope check"
            echo "item=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "item=$item_number" >> "$GITHUB_OUTPUT"
      - name: Run scope check
        if: steps.item.outputs.item != ''
        # Always pass the item number positionally rather than relying on
        # `aide scope`'s own branch inference: `actions/checkout` leaves a
        # detached HEAD on `pull_request` events, so `_current_branch` has
        # nothing to anchor on and the verb exits 2 -- a red PR on every
        # item. The number resolved above is passed explicitly instead.
        #
        # The one intentional behaviour change from the retired script: it
        # also skipped when no item spec existed for the branch's number.
        # That case now reaches the verb and exits 2 ("no spec for item
        # NNN"). This is correct and deliberate -- an aide/NNN- branch with
        # no spec is a real defect, and exit 2 is the framework's "reported,
        # never silently passed" contract.
        run: |
          python .aide/scripts/aide.py scope "${{ steps.item.outputs.item }}" --base "origin/${{ github.base_ref }}"

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu + windows are both x86_64. macos-latest (Apple Silicon /
        # arm64) is deliberately NOT in the matrix: several golden-file /
        # reference-artifact tests (test_022, test_042, test_045, test_063)
        # assert byte-identity or tight-tolerance equality against committed
        # fixtures that were generated on x86, and floating-point aggregates
        # (spline/curvature/EDT/percentile stats) are not reproducible across
        # CPU architectures -- different BLAS/SIMD/libm -- even at identical
        # numpy/scipy versions. Item 078 relaxed test_042 to numeric tolerance
        # (enough for x86 cross-platform), but arm64 divergence exceeds even
        # that for some values and the other three tests compare exactly.
        # Supporting arm64 needs its own effort (arch-portable goldens or
        # wide-tolerance conversion of all golden tests) -- tracked as item
        # 079, deferred. See docs/aide/items/079-arm64-golden-reproducibility.md.
        os: [ubuntu-latest, windows-latest]
    steps:
      # Full history, not the action's default depth-1 clone: two tests read
      # git history. tests/test_126_golden_retirement.py::test_ac4_... asserts
      # the retired snapshot goldens' newest history entry is a deletion and
      # fails with "no history found" on a shallow clone (PR #58's first CI
      # run, 2026-08-31, all four test jobs); tests/test_116_ras_native_corpus.py
      # AC7 reads reference goldens at pinned commit aeb2f55 and would otherwise
      # silently skip.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # Restore pip's HTTP/wheel cache between runs, keyed on the files
          # below. Five near-full installs of the same pinned scientific stack
          # happen per PR; without this each one re-downloads every wheel.
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - name: Install
        # Installed via constraints.txt (the Stage-9 Docker lockfile, item
        # 066), not pyproject.toml's loose lower bounds -- per item 001's own
        # design intent ("exact reproducibility pins belong in the deployable
        # container's lockfile/constraints, not in library metadata"). The
        # golden-file/reference-artifact byte-identity tests (items 042, 045,
        # 063) assert exact reproducibility, which only holds within this
        # pinned numpy/scipy environment: a fresh loose-bound install resolves
        # much newer numpy/scipy on Python 3.11 and their tiny last-digit
        # floating-point differences break byte-identity (found via CI; see
        # item 077). Contributors regenerating golden files locally should
        # likewise install via `-c constraints.txt`.
        run: pip install -e .[dev] -c constraints.txt
      - name: Test
        # -n 4 (pytest-xdist): the suite is parallel-safe and a GitHub-hosted
        # runner has 4 vCPUs, so the worker count is pinned to that rather
        # than left to `-n auto`. Measured locally 2026-09-01: 6690 passed in
        # 4m51s against 15m00s serial. windows-latest was the critical path of
        # the whole workflow at 21.0 min (run 33483503854).
        run: python -m pytest -n 4

  # Item 095: numpy-major agnosticism check. pyproject.toml declares a numpy
  # *range* (`numpy>=1.26,<3`), not a pin, specifically so the identical
  # segfacet code runs unmodified against both the real `spineps` conda
  # workstation environment (numpy 1.26.4, forced there by an sm_61 GPU ->
  # torch 2.4.1 ceiling -> monai<=1.4.0 -> numpy<2.0 chain) and a numpy-2.x
  # cluster/CI environment, without a fork. This job proves that range is
  # real, not aspirational, by installing the project once and then re-running
  # the full suite against each of the two concrete numpy versions this was
  # directly measured green against: 1.26.4 (the spineps ceiling) and 2.0.2
  # (constraints.txt's prior pin, the earlier CI baseline). It is additive,
  # not a restructuring of the `test` job's byte-identity-sensitive OS matrix
  # above -- see CLAUDE.md's note that the golden-file/reference comparisons
  # are numeric-tolerance (`reports_close`), not byte-identical against a
  # pinned numpy, which is what makes running across numpy majors safe here.
  #
  # Item 113: this job's Test step deliberately excludes the Docker- and
  # PyRadiomics-gated tests. The job proves numpy-major agnosticism only --
  # the environment-gated paths (Docker, PyRadiomics) are owned by
  # verify-environment-gated below, which already installs and verifies both
  # for real. Running them here instead buys zero additional numpy
  # verification (none of the excluded coverage exercises numpy at all) while
  # adding pure incidental risk: GitHub's ubuntu-latest runners have a real
  # Docker daemon, so the Docker-gated tests attempt a real `docker build`
  # against Docker Hub and have failed here on anonymous-pull rate-limiting /
  # `dial tcp ... i/o timeout` network flakiness, unrelated to numpy -- and
  # the two-numpy-leg matrix doubles that exposure on every push.
  test-numpy-majors:
    name: test (numpy ${{ matrix.numpy-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        numpy-version: ["1.26.4", "2.0.2"]
    steps:
      # Full history, not the action's default depth-1 clone: two tests read
      # git history. tests/test_126_golden_retirement.py::test_ac4_... asserts
      # the retired snapshot goldens' newest history entry is a deletion and
      # fails with "no history found" on a shallow clone (PR #58's first CI
      # run, 2026-08-31, all four test jobs); tests/test_116_ras_native_corpus.py
      # AC7 reads reference goldens at pinned commit aeb2f55 and would otherwise
      # silently skip.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e .[dev]
      - name: Pin numpy leg
        run: pip install numpy==${{ matrix.numpy-version }}
      - name: Test
        # Item 113: --ignore the Docker-gated modules wholesale (none of
        # them exercise numpy; verify-environment-gated owns real Docker
        # verification) and --deselect only the PyRadiomics-present-path
        # class inside test_features_radiomics.py, since the rest of that
        # module is numpy-sensitive builtin-backend coverage that must stay
        # collected.
        run: |
          python -m pytest -n 4 \
            --ignore=tests/test_066_dockerfile.py \
            --ignore=tests/test_069_container_smoke.py \
            --ignore=tests/test_070_acceptance_stage9.py \
            --deselect tests/test_features_radiomics.py::TestPresentPath

  # This project has two optional capabilities -- pyradiomics (Stage 8) and
  # the Docker container path (Stage 9) -- whose tests skip cleanly when the
  # dependency is absent (see .aide/conventions.md "Environment-gated
  # capabilities"). The `test` job above only ever exercises the skip path.
  # This job installs the real dependencies and proves the gated tests
  # actually run (not just pass-by-skipping) -- see assert_no_skips.py, which
  # fails the job outright if any of them report as skipped here.
  verify-environment-gated:
    name: verify environment-gated capabilities (radiomics + docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install base project (numpy etc. first)
        run: pip install -e .[dev]
      - name: Install pyradiomics's undeclared build-time dependencies
        # pyradiomics's legacy setup.py imports numpy AND versioneer at
        # build time, but its build-system.requires declares neither, so
        # pip's isolated per-package build env fails with
        # ModuleNotFoundError for each in turn (numpy first, then
        # versioneer once numpy was fixed). This is exactly the install
        # friction pyproject.toml's `radiomics` extra comment (item 060)
        # predicted -- pre-installing both here, then building with
        # --no-build-isolation, works around it.
        run: pip install versioneer
      - name: Install pyradiomics without build isolation
        run: pip install --no-build-isolation "pyradiomics>=3.0"
      - name: Confirm docker is available
        run: docker version
      - name: Run environment-gated test modules
        run: |
          python -m pytest -n 4 -v --junitxml=gated-results.xml \
            tests/test_features_radiomics.py \
            tests/test_066_dockerfile.py \
            tests/test_069_container_smoke.py \
            tests/test_070_acceptance_stage9.py
      - name: Fail if any environment-gated test was skipped
        # --allow: a couple of tests intentionally verify the *absent*-path
        # behaviour and correctly self-skip once they detect PyRadiomics is
        # actually installed (the inverse condition of every other gated
        # test here) -- see tests/test_features_radiomics.py's
        # test_ac5_absent_path_yields_builtin_markers_and_no_exception and
        # test_adv_enable_true_with_pyradiomics_absent_still_degrades_cleanly.
        run: |
          python .github/scripts/assert_no_skips.py gated-results.xml \
            --allow "PyRadiomics happens to be installed"
